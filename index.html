<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Sum of Ranks and Kinch Ranks for every WCA competitor, by world, continent and country. Updated daily.">
<meta property="og:type" content="website">

<meta property="og:description" content="Sum of Ranks and Kinch Ranks for every WCA competitor, by world, continent and country. Look up your own profile.">
<meta property="og:image" content="https://eonicmystic.github.io/cubing-ranks/ranks-preview.png">
<meta property="og:url" content="https://eonicmystic.github.io/cubing-ranks/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://eonicmystic.github.io/cubing-ranks/ranks-preview.png">
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #12161c; --muted: #5b6573; --line: #e2e6ec;
    --accent: #1f6feb; --accent-soft: #e4eeff; --good: #1a7f37; --gold: #b8860b; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f14; --card: #131921; --text: #e8ecf1; --muted: #98a3b1; --line: #242d38;
      --accent: #58a6ff; --accent-soft: #14283f; --good: #56d364; --gold: #e3b341; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f14; --card: #131921; --text: #e8ecf1; --muted: #98a3b1; --line: #242d38;
    --accent: #58a6ff; --accent-soft: #14283f; --good: #56d364; --gold: #e3b341; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: .88rem; margin: 0 0 12px; }
  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); padding: 4px; border-radius: 12px; margin-bottom: 12px; }
  .tabs button { flex: 1; min-width: 0; font-size: .92rem; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; padding: 9px 4px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: var(--bg); color: var(--text); font: inherit; font-size: .9rem; padding: 7px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  select, input[type=search] { font: inherit; font-size: .95rem; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
  input[type=search] { width: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: .93rem; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.me td { background: var(--accent-soft); }
  tr.go { cursor: pointer; }
  tr.go:hover td { background: var(--accent-soft); }
  .rk { color: var(--muted); font-variant-numeric: tabular-nums; width: 3.2em; }
  .rk.top { color: var(--gold); font-weight: 700; }
  .flag { color: var(--muted); font-size: .8rem; }
  .dl { font-size: .72rem; font-weight: 700; margin-left: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dl.up { color: var(--good); } .dl.dn { color: #d1242f; } .dl.nw { color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dl.dn { color: #ff7b72; } }
  :root[data-theme="dark"] .dl.dn { color: #ff7b72; }
  .badge { font-size: .68rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
  .star { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 0 4px; }
  .star.on { color: var(--gold); }
  tr.you td { background: var(--accent-soft); font-weight: 600; }
  .note { color: var(--muted); font-size: .82rem; margin: 8px 0 0; }
  .hit { display: flex; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; cursor: pointer; background: var(--bg); }
  .hit:hover { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .big { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .scope { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .scope:last-child { border-bottom: 0; }
  .scope b { font-variant-numeric: tabular-nums; }
  .pill { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: 0; }
  .ev h4 { margin: 0 0 4px; font-size: .98rem; display: flex; justify-content: space-between; gap: 8px; }
  .ev .ln { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; color: var(--muted); padding: 1px 0; }
  .ev .ln span:last-child { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .win { color: var(--good); font-weight: 700; }
  .cmp { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 4px 8px; font-size: .9rem; align-items: center; }
  .cmp .l { color: var(--muted); text-align: center; font-size: .82rem; }
  .cmp .a { text-align: left; } .cmp .b { text-align: right; } .cmp div { font-variant-numeric: tabular-nums; }
  .btn { border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: .88rem; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .loading { color: var(--muted); padding: 14px 0; }
  .err { color: #c0392b; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; margin: 18px 0 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Cubing Ranks</h1>
  <p class="sub" id="stamp">Loading…</p>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="lookup">Lookup</button>
    <button role="tab" data-tab="sum">Sum of Ranks</button>
    <button role="tab" data-tab="kinch">Kinch</button>
    <button role="tab" data-tab="events">Events</button>
    <button role="tab" data-tab="rising">Rising</button>
  </div>
  <div id="view"></div>
  <footer>Built from the public WCA results export. Not affiliated with the WCA. <a href="#about" id="aboutLink">How it works</a></footer>
</main>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (attrs[k] == null) continue;
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem("cr_" + k); localStorage.setItem("cr_" + k, v); } catch (e) { return null; } }
const b36 = t => t ? parseInt(t, 36) : 0;
const fold = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const bucketOf = tok => { const k = tok.slice(0, 3); return /^[a-z0-9]{2,3}$/.test(k) ? k : "_" + (tok.codePointAt(0) % 64); };
function shardOf(w) { let h = 0; for (let k = 0; k < w.length; k++) h = (h * 31 + w.charCodeAt(k)) % 1000003; return h % 256; }
async function getRetry(url, json) {
  let last;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url); if (r.ok) return json ? r.json() : r.text(); last = new Error(url + " " + r.status); }
    catch (e) { last = e; }
    await new Promise(r => setTimeout(r, 400 * (i + 1)));
  }
  throw last;
}

let META = null;
const lbCache = new Map(), shardCache = new Map(), bucketCache = new Map(), personCache = new Map();
let profile = null;
try { profile = JSON.parse(store("profile") || "null"); } catch (e) { profile = null; }
if (profile && !profile.id) profile = null;

const ST = {
  tab: "sum", nb: store("nb") === "1", sel: null, imp: +store("imp") || 5, kind: store("kind") || "C", scope: store("scope") || "w", cont: +store("cont") || 0, country: store("country"),
};
const EV_SHORT = ["3x3", "2x2", "4x4", "5x5", "6x6", "7x7", "3BLD", "FMC", "OH", "Clock", "Mega", "Pyra", "Skewb", "SQ-1", "4BLD", "5BLD", "MBLD"];
function initSel() {
  const n = META.events.length;
  let v = null; const t = store("sel");
  if (t && t.length === n && /^[01]+$/.test(t)) v = [...t].map(c => c === "1");
  ST.sel = v || (ST.nb ? META.events.map((_, i) => !META.excl.includes(i)) : new Array(n).fill(true));
  syncNb();
}
function selMode() {
  if (ST.sel.every(Boolean)) return "all";
  if (ST.sel.every((x, i) => x === !META.excl.includes(i))) return "nb";
  return "custom";
}
function syncNb() { ST.nb = selMode() === "nb"; store("nb", ST.nb ? "1" : "0"); store("sel", ST.sel.map(x => x ? "1" : "0").join("")); }
function setSel(v) { ST.sel = v; syncNb(); }
const vOf = p => ST.nb ? p.nb : p.all;
const NEV = () => ST.nb ? META.events.length - META.excl.length : META.events.length;
const isEx = ev => ST.nb && META.excl.includes(ev);
function flash(btn, msg) { const t = btn.textContent; btn.textContent = msg; setTimeout(() => btn.textContent = t, 1800); }
const SCOPES = [["w", "World"], ["c", "Continent"], ["n", "Country"]];

/* ---------- formatting ---------- */
function fmtTime(cs) {
  if (!cs) return "—";
  const t = cs / 100;
  if (t >= 60) { const m = Math.floor(t / 60), s = (t - m * 60).toFixed(2).padStart(5, "0"); return m >= 60 ? Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + ":" + s : m + ":" + s; }
  return t.toFixed(2);
}
function fmtVal(ev, isAvg, v) {
  if (!v) return "—";
  const id = META.events[ev];
  if (id === "333fm") return isAvg ? (v / 100).toFixed(2) : String(v);
  if (id === "333mbf") {
    const dd = Math.floor(v / 1e7), t = Math.floor(v / 100) % 100000, miss = v % 100;
    const pts = 99 - dd, solved = pts + miss;
    const m = Math.floor(t / 60), s = String(t % 60).padStart(2, "0");
    return solved + "/" + (solved + miss) + " " + m + ":" + s;
  }
  return fmtTime(v);
}
const n0 = x => Number(x).toLocaleString("en-US");
const fmtK = v => (v / 100).toFixed(2);
const nth = n => "#" + n0(n);

function topPct(rank, pop) {
  const x = rank / pop * 100;
  return "Top " + (x < 1 ? (Math.max(x, 0.01)).toFixed(x < 0.1 ? 2 : 1) : Math.ceil(x)) + "%";
}
async function shareImage(c, name, btn) {
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (!blob) { flash(btn, "Couldn't make image"); return; }
  const file = new File([blob], name, { type: "image/png" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); flash(btn, "Image saved");
}
/* rows: [rank text, name, right text, extra text, extra colour] */
async function saveList(btn, title, sub, rows, fname) {
  const W = 1080, H = 1350, F = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#0b0f14"); bg.addColorStop(1, "#12212f");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = "#58a6ff"; g.font = "700 30px " + F; g.fillText("CUBING RANKS", 72, 96);
  g.fillStyle = "#e8ecf1"; g.font = "800 62px " + F; g.fillText(title, 72, 176);
  g.fillStyle = "#98a3b1"; g.font = "400 30px " + F;
  let sb = sub; while (g.measureText(sb).width > W - 144 && sb.length > 8) sb = sb.slice(0, -2);
  g.fillText(sb === sub ? sb : sb + "…", 72, 226);
  const top = rows.slice(0, 10), rh = 92;
  top.forEach((r, i) => {
    const y = 270 + i * (rh + 8);
    rrect(g, 72, y, W - 144, rh, 22, "#131921");
    g.fillStyle = i < 3 && /^\d+$/.test(r[0]) ? "#e3b341" : "#98a3b1"; g.font = "800 40px " + F; g.fillText(r[0], 100, y + 60);
    g.fillStyle = "#e8ecf1"; g.font = "700 36px " + F;
    let nm = r[1]; const maxW = W - 144 - 190 - (r[3] ? 330 : 230);
    while (g.measureText(nm).width > maxW && nm.length > 4) nm = nm.slice(0, -2);
    g.fillText(nm === r[1] ? nm : nm + "…", 210, y + 60);
    g.textAlign = "right";
    if (r[3]) { g.fillStyle = r[4] || "#56d364"; g.font = "800 34px " + F; g.fillText(r[3], W - 100, y + 60); g.fillStyle = "#98a3b1"; g.font = "400 30px " + F; g.fillText(r[2], W - 100 - 170, y + 60); }
    else { g.fillStyle = "#58a6ff"; g.font = "800 40px " + F; g.fillText(r[2], W - 100, y + 60); }
    g.textAlign = "left";
  });
  g.fillStyle = "#98a3b1"; g.font = "400 28px " + F;
  g.fillText(location.host + location.pathname.replace(/index\.html$/, "") + " · " + (META.updated || "").slice(0, 10), 72, H - 52);
  await shareImage(c, fname, btn);
}

/* ---------- movement ---------- */
const SNAPM = ["k", "S", "A", "C"];
const hasMv = () => !!(META && META.mv && META.mv.since);
function dlt(cur, prev) {
  if (!hasMv()) return null;
  if (!prev) return el("span", { class: "dl nw" }, "new");
  const d = prev - cur;
  if (!d) return null;
  return el("span", { class: "dl " + (d > 0 ? "up" : "dn") }, (d > 0 ? "▲" : "▼") + n0(Math.abs(d)));
}
const prevOf = (p, m, s) => p.prev ? p.prev[SNAPM.indexOf(m) * 3 + s] : 0;
function getList() { try { const a = JSON.parse(store("list") || "[]"); return Array.isArray(a) ? a.filter(x => typeof x === "string") : []; } catch (e) { return []; } }
function setList(a) { store("list", JSON.stringify(a.slice(0, 15))); }
const scopeKey = (s, p) => s === 0 ? "w" : s === 1 ? "c" + p.cont : "n" + p.country;

/* ---------- data ---------- */
async function loadMeta() {
  META = await getRetry("meta.json", true);
  const d = META.updated || "";
  $("#stamp").textContent = n0(META.people) + " competitors · data from the WCA export of " + d.replace(" UTC", "") + " UTC · updates daily";
  if (ST.country == null || !META.countries[ST.country]) {
    const us = META.countries.findIndex(c => c[0] === "USA" || c[0] === "United States");
    ST.country = us >= 0 ? us : 0;
  } else ST.country = +ST.country;
}
async function loadLB(scope, idx) {
  const f = scope === "w" ? META.files.w : META.files[scope][idx];
  if (!lbCache.has(f)) lbCache.set(f, getRetry("lb/" + f, true));
  return lbCache.get(f);
}
async function loadShard(id) {
  const n = shardOf(id);
  if (!shardCache.has(n)) shardCache.set(n, getRetry("p/" + n + ".txt").then(t => t.split("\n")));
  return shardCache.get(n);
}
async function loadPerson(id) {
  if (personCache.has(id)) return personCache.get(id);
  const lines = await loadShard(id);
  for (const ln of lines) {
    if (!ln.startsWith(id + "|")) continue;
    const p = ln.split("|");
    const h = p[3].split(",").map(b36);
    const evs = {};
    (p[4] || "").split(";").filter(Boolean).forEach(s => {
      const f = s.split(",");
      evs[+f[0]] = { s: [b36(f[1]), b36(f[2]), b36(f[3]), b36(f[4])], a: [b36(f[5]), b36(f[6]), b36(f[7]), b36(f[8])] };
    });
    const mk = o => ({
      kin: [h[o], h[o + 1], h[o + 2]], kinRank: [h[o + 3], h[o + 4], h[o + 5]],
      sum: { S: [h[o + 6], h[o + 7], h[o + 8]], A: [h[o + 9], h[o + 10], h[o + 11]], C: [h[o + 12], h[o + 13], h[o + 14]] },
      sumRank: { S: [h[o + 15], h[o + 16], h[o + 17]], A: [h[o + 18], h[o + 19], h[o + 20]], C: [h[o + 21], h[o + 22], h[o + 23]] },
    });
    const out = { id, name: p[1], country: b36(p[2]), evs, all: mk(0), nb: mk(24), prev: p[5] ? p[5].split(",").map(b36) : null };
    out.cont = META.countries[out.country][1];
    personCache.set(id, out);
    return out;
  }
  return null;
}
async function searchPeople(q) {
  const raw = q.trim();
  if (/^\d{4}[a-z]{4}\d{2}$/i.test(raw)) {
    const p = await loadPerson(raw.toUpperCase());
    return p ? [{ id: p.id, name: p.name, country: META.countries[p.country][0] }] : [];
  }
  const toks = fold(raw).split(/[^\p{L}\p{N}_]+/u).filter(t => t.length >= 2);
  if (!toks.length) return null;
  const long = toks.reduce((a, b) => b.length > a.length ? b : a), key = bucketOf(long);
  let rows = bucketCache.get(key);
  if (!rows) {
    const r = await fetch("p/s_" + key + ".txt");
    rows = r.ok ? (await r.text()).split("\n").filter(Boolean).map(l => { const [id, name, country] = l.split("\t"); return { id, name, country }; }) : [];
    bucketCache.set(key, rows);
  }
  const hit = [];
  for (const r of rows) {
    if (r.f === undefined) r.f = fold(r.name);
    if (toks.every(t => r.f.includes(t))) hit.push(r);
    if (hit.length >= 60) break;
  }
  hit.sort((a, b) => (b.f.startsWith(toks[0]) ? 1 : 0) - (a.f.startsWith(toks[0]) ? 1 : 0));
  return hit.slice(0, 8);
}

/* ---------- Kinch per event (same rules as the build) ---------- */
const BLIND = ["333bf", "444bf", "555bf"];
function eff(v) { const dd = Math.floor(v / 1e7), t = Math.floor(v / 100) % 100000; return (99 - dd) + (3600 - Math.min(t, 3600)) / 3600; }
function recFor(si, p) {
  if (si === 0) return META.rec.w;
  return si === 1 ? META.rec.c[p.cont] : META.rec.n[p.country];
}
function kscore(ev, e, si, p) {
  const id = META.events[ev], R = recFor(si, p)[ev], ps = e.s[3], pa = e.a[3];
  if (id === "333mbf") return ps && R[0] ? 100 * eff(ps) / eff(R[0]) : 0;
  if (BLIND.includes(id)) { const a = pa && R[1] ? R[1] / pa : 0, s = ps && R[0] ? R[0] / ps : 0; return 100 * Math.max(a, s); }
  return pa && R[1] ? 100 * R[1] / pa : 0;
}


/* ---------- custom event combinations ---------- */
const PRESETS = [
  ["All", i => true],
  ["No blindfolded", i => !META.excl.includes(i)],
  ["NxN cubes", i => ["333", "222", "444", "555", "666", "777"].includes(META.events[i])],
  ["3x3 events", i => ["333", "333oh", "333bf", "333fm", "333mbf"].includes(META.events[i])],
  ["Blindfolded", i => META.excl.includes(i)],
];
function eventPicker(rerender) {
  const wrap = el("div", { class: "card", style: "margin-bottom:10px;padding:10px" });
  const mode = selMode();
  const head = el("div", { class: "row", style: "justify-content:space-between;margin-bottom:6px" },
    el("b", {}, "Events " + "(" + ST.sel.filter(Boolean).length + " of " + ST.sel.length + ")"),
    el("span", { class: "flag" }, mode === "custom" ? "Custom combination" : mode === "nb" ? "No blindfolded" : "All events"));
  const chips = el("div", { class: "row", style: "gap:6px;margin-bottom:8px" }, EV_SHORT.map((l, i) =>

/* ---------- where could you gain the most? ---------- */
function estRank(k, ev, v) {
  const g = META.grid[k][ev], at = META.grid_at;
  if (!g || !g.length || !v) return null;
  if (v <= g[0]) return 1;
  for (let j = 1; j < g.length; j++) if (v <= g[j]) {
    if (g[j] === g[j - 1]) return at[j];
    const f = (v - g[j - 1]) / (g[j] - g[j - 1]);
    return Math.exp(Math.log(at[j - 1]) + f * (Math.log(at[j]) - Math.log(at[j - 1])));
  }
  return at[g.length - 1] * 1.5;
}

  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#0b0f14"); bg.addColorStop(1, "#12212f");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = "#58a6ff"; g.font = "700 30px " + F; g.fillText("CUBING RANKS", 72, 96);
  g.fillStyle = "#e8ecf1"; g.font = "800 68px " + F;
  let nm = p.name; while (g.measureText(nm).width > W - 144 && nm.length > 4) nm = nm.slice(0, -2);
  g.fillText(nm === p.name ? nm : nm + "…", 72, 190);
  g.fillStyle = "#98a3b1"; g.font = "400 30px " + F;
  g.fillText(p.id + " · " + META.countries[p.country][0] + (ST.nb ? " · no blindfolded" : ""), 72, 240);
  const scopes = [["World", 0], [META.conts[p.cont], 1], [META.countries[p.country][0], 2]];
  const pop = [META.pop.w, META.pop.c[p.cont], META.pop.n[p.country]];
  const block = (y, title, valFn, rkFn) => {
    rrect(g, 72, y, W - 144, 330, 28, "#131921");
    g.fillStyle = "#98a3b1"; g.font = "700 26px " + F; g.fillText(title.toUpperCase(), 108, y + 56);
    scopes.forEach(([n, s], i) => {
      const yy = y + 124 + i * 82;
      g.fillStyle = "#98a3b1"; g.font = "400 30px " + F; g.fillText(n.length > 18 ? n.slice(0, 17) + "…" : n, 108, yy);
      g.fillStyle = "#e8ecf1"; g.font = "800 44px " + F; g.textAlign = "right"; g.fillText(valFn(s), 660, yy + 4);
      g.fillStyle = "#58a6ff"; g.font = "700 32px " + F; g.fillText("#" + n0(rkFn(s)) + " of " + n0(pop[s]), W - 108, yy);
      g.textAlign = "left";
    });
  };
  block(290, "Kinch score", s => fmtK(p.kin[s]), s => p.kinRank[s]);
  block(650, "Sum of ranks · combined", s => n0(p.sum.C[s]), s => p.sumRank.C[s]);
  const best = META.events.map((id, ev) => ({ ev, k: p.evs[ev] && !isEx(ev) ? kscore(ev, p.evs[ev], 0, p) : 0 })).sort((a, b) => b.k - a.k).slice(0, 3).filter(x => x.k > 0);
  g.fillStyle = "#98a3b1"; g.font = "700 26px " + F; g.fillText("BEST EVENTS (WORLD KINCH)", 72, 1060);
  best.forEach((x, i) => {
    const xx = 72 + i * 316;
    rrect(g, xx, 1090, 300, 130, 22, "#131921");
    g.fillStyle = "#98a3b1"; g.font = "400 26px " + F; const n = META.names[x.ev]; g.fillText(n.length > 16 ? n.slice(0, 15) + "…" : n, xx + 24, 1138);
    g.fillStyle = "#56d364"; g.font = "800 44px " + F; g.fillText(x.k.toFixed(1), xx + 24, 1192);
  });
  g.fillStyle = "#98a3b1"; g.font = "400 28px " + F;
  g.fillText(location.host + location.pathname.replace(/index\.html$/, ""), 72, H - 52);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (!blob) { flash(btn, "Couldn't make image"); return; }
  const file = new File([blob], "cubing-ranks-" + p.id + ".png", { type: "image/png" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); flash(btn, "Image saved");
}

function renderAbout() {
  setTab("");
  view.replaceChildren(el("div", { class: "card" },
    el("h3", { style: "margin-top:0" }, "How it works"),
    el("p", {}, el("b", {}, "Sum of Ranks. "), "Add up your rank in every event. Single uses your best single in all 17 events, Average uses your best average in the 16 events that have one, and Combined adds both. If you haven't done an event, you're given one rank past the last ranked person in that event, so skipping an event never helps. Lower is better. Ties share the best rank."),
    el("p", {}, el("b", {}, "Kinch Ranks. "), "For each event, your score is the record ÷ your personal best × 100 (so the record holder scores 100). Your Kinch score is the average of all 17 events, with 0 for events you haven't done. Events use averages, except the blindfolded events (best of single or average ratio), Fewest Moves (average), and Multi-Blind (points and time). Higher is better."),
    el("p", {}, el("b", {}, "Continent and country. "), "The same math applies inside each region: the record is the best in that region, and ranks are among people from that region."),
    el("p", {}, "The No blindfolded option leaves out 3x3, 4x4 and 5x5 Blindfolded and Multi-Blind (Kinch then averages 13 events). The Events tab is the standard single and average rankings for each event, deep lists for the world, continents and countries. Rankings are built nightly from the WCA results export. Sum of Ranks and Kinch lists show the top 1,000 for the world and continents and the top 500 for countries; Lookup works for everyone. Arrows show how many places someone moved since the last comparison day (about a week back once history builds up) in the all-events rankings. Biggest movers lists the largest climbs and drops among the top 5,000 (top 1,000 for countries), the Rising tab ranks people who started competing in the last three years, Around you shows the people ranked next to you, and My list keeps people you follow on this device. You can also compare two people or save a shareable image there."),
    el("button", { class: "btn", onclick: () => go("#lookup") }, "Back")));
}

function route() {
  const h = location.hash.replace(/^#/, "");
  if (!META) return;
  if (h.startsWith("compare")) { const q = h.split("/"); return renderCompare((q[1] || "").toUpperCase(), (q[2] || "").toUpperCase() || null); }
  if (h === "events") return renderEvents();
  if (h === "rising") return renderRisingTab();
  if (h.startsWith("lookup")) return renderLookup((h.split("/")[1] || "").toUpperCase() || null);
  if (h === "kinch") return renderBoard("k");
  if (h === "about") return renderAbout();
  if (h === "sum") return renderBoard("S");
  return renderLookup(null);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => go("#" + b.dataset.tab)));
window.addEventListener("hashchange", route);
loadMeta().then(() => { initSel(); route(); }).catch(() => { $("#stamp").textContent = "Couldn't load the data. Reload to try again."; });
</script>
</body>
</html>
