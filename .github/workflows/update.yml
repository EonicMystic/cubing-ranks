name: Update rankings

on:
  schedule:
    - cron: '12 1 * * *'        # every day, after the WCA publishes its export (~00:30 UTC)
  workflow_dispatch:            # lets you press "Run workflow" by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WCA export
        run: curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/export.zip" https://www.worldcubeassociation.org/export/results/v2/tsv

      - name: Get saved rank history
        run: |
          mkdir -p "$RUNNER_TEMP/hist"
          if git fetch -q --depth 1 origin rank-history; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/hist"
            echo "Loaded saved history:"; ls "$RUNNER_TEMP/hist"
          else
            echo "No saved history yet, starting fresh"
          fi

      - name: Build site
        run: |
          mkdir -p site
          python3 build_ranks.py "$RUNNER_TEMP/export.zip" site "$RUNNER_TEMP/hist"
          cp index.html site/index.html
          cp ranks-preview.png site/ranks-preview.png || echo "no preview image found, skipping"

      - name: Build gender rankings
        run: |
          for g in m f; do
            RANK_GENDER=$g python3 build_ranks.py "$RUNNER_TEMP/export.zip" "site/g/$g" "$RUNNER_TEMP/ghist_$g"
          done

      - name: Check the site folder
        run: |
          ls -la site
          python3 -c "import json; d=json.load(open('site/meta.json')); assert d['people']>100000, 'too few people'; assert len(d['events'])==17"
          test -s site/index.html
          test "$(ls site/p | wc -l)" -gt 200
          test "$(ls site/ev | wc -l)" -gt 500
          test "$(ls site/cx | wc -l)" -ge 30
          test "$(ls site/mv | wc -l)" -gt 100
          test "$(ls site/nb | wc -l)" -gt 500
          test "$(ls site/rs | wc -l)" -gt 100
          for g in m f; do test -s "site/g/$g/lb/world.json"; test "$(ls site/g/$g/ev | wc -l)" -gt 100; done
          test "$(ls "$RUNNER_TEMP/hist" | wc -l)" -ge 1

      - name: Save rank history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp "$RUNNER_TEMP"/hist/ranks_*.txt.gz "$d/"
          (cd "$d" && git init -q -b hist && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com \
            && git add . && git commit -qm "Rank history" \
            && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hist:rank-history) \
            && echo "Saved rank history" || echo "Could not save rank history"

      - name: Keep the schedule alive
        run: |
          # GitHub switches off scheduled runs after 60 days without any commit, so make a tiny one monthly
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            date -u +%F > .keepalive
            git add .keepalive
            git commit -m "Keep scheduled runs alive"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for the upload to register
        run: sleep 15

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
